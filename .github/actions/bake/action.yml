name: Docker Bake
description: General Docker Bake target executor.

inputs:
  target:
    description: Bake target to execute.
    required: true

  artifact-path:
    description: Directory where Bake exports and the action uploads artifacts.
    default: dist
  
runs:
  using: composite

  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        cache-binary: false
        use: true
        driver-opts: image=moby/buildkit:v0.34.0

    - name: Bake target:(${{ inputs.target }})
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
      with:
        source: https://github.com/${{ github.repository }}.git#${{ github.sha }}
        targets: ${{ inputs.target }}
      env:
        BUILDX_BAKE_GIT_AUTH_TOKEN: ${{ github.token }}
        
        ARTIFACT_PATH: ${{inputs.artifact-path}}

    - name: Update artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.target }}-artifact-pr-${{ github.event.pull_request.number }}
        path: ${{ inputs.artifact-path }}


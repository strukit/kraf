name: Docker Bake
description: General Docker Bake target executor.

inputs:
  target:
    description: Bake target to execute.
    required: true

  artifact-path:
    description: Directory where Bake exports and the action uploads artifacts.
    default: .dist
  
runs:
  using: composite

  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        cache-binary: false
        use: true

    - name: Bake target:(${{ inputs.target }})
      uses: docker/bake-action@v7
      with:
        source: https://github.com/${{ github.repository }}.git#${{ github.sha }}
        targets: ${{ inputs.target }}
      env:
        DOCKER_BUILD_CHECKS_ANNOTATIONS: true
        DOCKER_BUILD_SUMMARY: false
        DOCKER_BUILD_RECORD_UPLOAD: true

        BUILDX_BAKE_GIT_AUTH_TOKEN: ${{ github.token }}
        
        ARTIFACT_PATH: ${{inputs.artifact-path}}

    - name: Update artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.target }}-artifact-pr-${{ github.event.pull_request.number }}
        path: ${{ inputs.artifact-path }}
        include-hidden-files: true


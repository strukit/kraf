name: Docker Bake
description: General Docker Bake target executor.

inputs:
  target:
    description: Bake target to execute.
    required: true

  artifact-path:
    description: Directory where Bake exports and the action uploads artifacts.
    default: dist
  
runs:
  using: composite

  steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Start BuildKit daemon
      shell: bash
      run: |
        docker compose up --detach --wait buildkitd
        container="$(docker compose ps -q buildkitd)"
        name="$(docker inspect --format '{{.Name}}' "$container")"
        echo "BUILDKIT_ENDPOINT=docker-container://${name#/}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        cache-binary: false
        use: true
        version: v0.39.0
        driver: remote
        endpoint: ${{ env.BUILDKIT_ENDPOINT }}

    - name: Bake target:(${{ inputs.target }})
      uses: docker/bake-action@v7.5.0
      with:
        source: .
        targets: ${{ inputs.target }}
      env:
        ARTIFACT_PATH: ${{inputs.artifact-path}}

    - name: Update artifacts
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.target }}-artifact-pr-${{ github.event.pull_request.number }}
        path: ${{ inputs.artifact-path }}

name: Pull Request 

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-amd:
    name: Quality Gates - Linux
    runs-on: ubuntu-26.04
    steps:
      - uses: $/.github/actions/bake
        with:
          target: linux-amd64

  build-arm:
    name:  Quality Gates - Linux ARM
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: $/.github/actions/bake
        with:
          target: linux-arm64
[package]
name = "kraf"
version.workspace = true
categories = ["command-line-utilities"]
edition.workspace = true
include.workspace = true
keywords = ["development", "environment", "agents", "portable", "vendor-neutral"]
license-file = "../../LICENSE"
publish.workspace = true
repository.workspace = true
description = "Command-line interface for the kraf development environment layer"

[[bin]]
name = "kraf"
path = "src/main.rs"

[[bin]]
name = "kraf-read"
path = "src/read.rs"

[[bin]]
name = "kraf-mcp"
path = "src/mcp.rs"

[lints]
workspace = true

[dependencies]
kraf-core.workspace = true
kraf-environment.workspace = true
kraf-lib.workspace = true
kraf-tools.workspace = true
rmcp = { version = "3.4", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt"] }

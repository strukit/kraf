[workspace]
resolver = "3"
members = ["src/bin", "src/core"]
default-members = ["src/core", "src/bin"]

[workspace.package]
version = "0.0.1"
edition = "2024"
include = ["/src/**", "!**/tests/**", "!**/docs/**", "!**/README.md"]
publish = false
repository = "https://github.com/strukit/kraf"

[workspace.dependencies]
kraf-core = { path = "src/core", version = "0.0.1" }

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "deny"
perf = "warn"
complexity = "warn"
pedantic = "warn"
cargo = "warn"

[workspace]
resolver = "3"
members = ["src/*"]
default-members = ["src/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
include = ["/src/**", "!**/tests/**", "!**/docs/**", "!**/README.md"]
license = "MIT"
publish = false
repository = "https://github.com/strukit/kraf"

[workspace.dependencies]
kraf-core = { path = "src/core", version = "0.0.1" }
kraf-environment = { path = "src/environment", version = "0.0.1" }

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "deny"
perf = "warn"
complexity = "warn"
pedantic = "warn"
cargo = "warn"
